name: build-installer
on:
  workflow_dispatch:
    inputs:
      builder:
        description: 'nuitka (compiled C, no readable source) or pyinstaller (bytecode)'
        required: true
        default: 'nuitka'
        type: choice
        options: ['nuitka', 'pyinstaller']
      release:
        description: 'publish a GitHub release with this build (the in-app updater needs it)'
        required: true
        default: true
        type: boolean
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create venv and install pinned requirements
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
      - name: Build (compiled, selftest gate, Inno Setup)
        if: inputs.builder == 'nuitka'
        shell: pwsh
        run: |
          .\build_windows_nuitka.ps1
          if (-not (Test-Path 'dist-installer\GatoSetup.exe')) { throw 'GatoSetup.exe missing' }
          Get-FileHash 'dist-installer\GatoSetup.exe' -Algorithm SHA256 | Format-List
      - name: Build (PyInstaller, selftest gate, Inno Setup)
        if: inputs.builder == 'pyinstaller'
        shell: pwsh
        run: |
          .\build_windows.ps1
          if (-not (Test-Path 'dist-installer\GatoSetup.exe')) { throw 'GatoSetup.exe missing' }
          Get-FileHash 'dist-installer\GatoSetup.exe' -Algorithm SHA256 | Format-List
      - name: No readable source in the shipped tree
        if: always()
        shell: pwsh
        run: |
          $py = @(Get-ChildItem 'dist\Gato' -Filter '*.py' -Recurse -ErrorAction SilentlyContinue)
          Write-Host ("leftover .py files: " + $py.Count)
          if ($py.Count -gt 0) { $py | Select-Object -First 10 FullName | Format-Table -AutoSize }
      - name: Show selftest
        if: always()
        shell: pwsh
        run: |
          foreach ($p in @('dist\Gato\selftest.txt', 'distn\run_gato.dist\selftest.txt',
                           "$env:LOCALAPPDATA\GATO\selftest.txt",
                           'selftest.stdout.txt', 'selftest.stderr.txt')) {
            if (Test-Path $p) { Write-Host "--- $p"; Get-Content $p }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GatoSetup
          path: dist-installer/GatoSetup.exe
          compression-level: 0
          retention-days: 7
      - name: Read version
        if: inputs.release
        id: v
        shell: pwsh
        run: |
          $ver = (Get-Content 'VERSION' -ErrorAction Stop | Select-Object -First 1).Trim()
          if (-not $ver) { throw 'VERSION is empty' }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT
      # The release lives in the PUBLIC gato-setup repo. update.py reads
      # api.github.com/repos/J0SEPH-K/gato-setup/releases/latest, compares the tag against VERSION and
      # installs the asset named GatoSetup.exe. Without this step there is no download link and the
      # in-app updater never sees a newer build.
      - name: Publish release
        if: inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'RELEASE_TOKEN secret is not set' }
          $notes = @"
          GATO $env:VER

          - 조철 정답 판독: 추적 폴백이 정착 프레임을 슬롯 격자에 맞춰 고정 (엉뚱한 슬롯에 5/5 만장일치로 오답하던 문제)
          - 정착 판독과 추적이 모두 실패하면 클릭하지 않고 정지 (불확실)
          - 릴레이(1.0.16+)로 로그인 코드만 있으면 원격에서 로그 실시간 확인 가능
          "@
          $notes | Out-File -FilePath notes.md -Encoding utf8
          gh release create $env:TAG 'dist-installer/GatoSetup.exe' --repo J0SEPH-K/gato-setup --title "GATO $env:VER" --notes-file notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
