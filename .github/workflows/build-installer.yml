name: build-installer
on:
  workflow_dispatch:
    inputs:
      builder:
        description: 'nuitka (compiled C, no readable source) or pyinstaller (bytecode)'
        required: true
        default: 'nuitka'
        type: choice
        options: ['nuitka', 'pyinstaller']
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create venv and install pinned requirements
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
      - name: Build (compiled, selftest gate, Inno Setup)
        if: inputs.builder == 'nuitka'
        shell: pwsh
        run: |
          .\build_windows_nuitka.ps1
          if (-not (Test-Path 'dist-installer\GatoSetup.exe')) { throw 'GatoSetup.exe missing' }
          Get-FileHash 'dist-installer\GatoSetup.exe' -Algorithm SHA256 | Format-List
      - name: Build (PyInstaller, selftest gate, Inno Setup)
        if: inputs.builder == 'pyinstaller'
        shell: pwsh
        run: |
          .\build_windows.ps1
          if (-not (Test-Path 'dist-installer\GatoSetup.exe')) { throw 'GatoSetup.exe missing' }
          Get-FileHash 'dist-installer\GatoSetup.exe' -Algorithm SHA256 | Format-List
      - name: No readable source in the shipped tree
        if: always()
        shell: pwsh
        run: |
          $py = @(Get-ChildItem 'dist\Gato' -Filter '*.py' -Recurse -ErrorAction SilentlyContinue)
          Write-Host ("leftover .py files: " + $py.Count)
          if ($py.Count -gt 0) { $py | Select-Object -First 10 FullName | Format-Table -AutoSize }
      - name: Show selftest
        if: always()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\GATO\selftest.txt" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: GatoSetup
          path: dist-installer/GatoSetup.exe
          compression-level: 0
          retention-days: 7
